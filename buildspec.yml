version: 0.2

env:
  variables:
    ECR_REPO: "somdip/user-containers"
    IMAGE_TAG: "comfyui-gpu-latest"

phases:
  pre_build:
    commands:
      - export ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - echo "Building $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
      - DOCKERHUB_CREDS=$(aws secretsmanager get-secret-value --secret-id dockerhub/credentials --query SecretString --output text)
      - echo "$DOCKERHUB_CREDS" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['password'])" | docker login --username $(echo "$DOCKERHUB_CREDS" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['username'])") --password-stdin
      - docker pull nvidia/cuda:12.4.1-runtime-ubuntu22.04
  build:
    commands:
      - docker build -t "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG" .
      - docker push "$ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG"
  post_build:
    commands:
      - aws ecr describe-images --repository-name "$ECR_REPO" --image-ids imageTag="$IMAGE_TAG" --output json || true
